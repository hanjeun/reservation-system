# ============================================
# 모든 환경 공통 설정
# ============================================

# 서버 공통 설정
server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      tracking-modes: cookie
      timeout: 30m
      cookie:
        max-age: 1800

# Spring 공통 설정
spring:
  # 개발 도구
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  # Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/

  # 파일 업로드
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2MB

  # JPA 공통 설정
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # OAuth2 Provider 설정 (공통)
  security:
    oauth2:
      client:
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# JWT 설정
jwt:
  issuer: reservation-system
  access-token:
    expiration-minutes: 30
  refresh-token:
    expiration-days: 14

# 파일 업로드 경로
file:
  upload-dir: uploads

# 로깅 설정
logging:
  level:
    root: INFO
    ac.inhatc.reservation_system: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 메일 설정
mail:
  host: smtp.gmail.com
  port: 587
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# 포트원 설정
portone:
  pg-provider: kakaopay
