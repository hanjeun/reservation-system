      on-profile: green

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: http://15.165.103.103:8081/login/oauth2/code/google
          naver:
            redirect-uri: http://15.165.103.103:8081/login/oauth2/code/naver
          kakao:
            redirect-uri: http://15.165.103.103:8081/login/oauth2/code/kakao

server:
  port: 8081
  serverAddress: 15.165.103.103
  env: green

serverName: green_server
