<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:with="title='문의하기', currentPage='inquiry'"
      layout:decorate="~{layouts/main-layout}">
<head>
    <meta charset="UTF-8">
    <th:block layout:fragment="custom-css">
        <style>
            .inquiry-wrapper {
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                min-height: calc(100vh - 200px);
                padding: 40px 20px;
            }

            .inquiry-container {
                max-width: 1200px;
                margin: 0 auto;
            }

            .inquiry-header {
                background: white;
                border-radius: 24px;
                padding: 48px;
                margin-bottom: 32px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.1);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .header-left h1 {
                font-size: 36px;
                font-weight: 700;
                color: #667eea;
                margin-bottom: 8px;
            }

            .header-left p {
                font-size: 16px;
                color: #666;
            }

            .btn-new-inquiry {
                padding: 14px 32px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 12px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
            }

            .btn-new-inquiry:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            }

            .inquiries-container {
                background: white;
                border-radius: 24px;
                padding: 32px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            }

            .inquiry-card {
                padding: 24px;
                border-bottom: 1px solid #e0e0e0;
                cursor: pointer;
                transition: all 0.3s;
            }

            .inquiry-card:hover {
                background: #f9f9f9;
            }

            .inquiry-card:last-child {
                border-bottom: none;
            }

            .inquiry-header-row {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 12px;
            }

            .inquiry-title-section {
                flex: 1;
            }

            .inquiry-category {
                display: inline-block;
                padding: 4px 12px;
                background: #667eea;
                color: white;
                border-radius: 6px;
                font-size: 12px;
                font-weight: 600;
                margin-bottom: 8px;
            }

            .inquiry-status {
                display: inline-block;
                padding: 6px 12px;
                border-radius: 6px;
                font-size: 13px;
                font-weight: 600;
            }

            .status-pending {
                background: #fff3cd;
                color: #856404;
            }

            .status-answered {
                background: #d4edda;
                color: #155724;
            }

            .inquiry-title {
                font-size: 18px;
                font-weight: 600;
                color: #1E1E1E;
                margin-bottom: 8px;
            }

            .inquiry-meta {
                display: flex;
                gap: 16px;
                font-size: 13px;
                color: #999;
            }

            .empty-state {
                text-align: center;
                padding: 80px 20px;
                color: #999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .empty-icon {
                font-size: 64px;
                margin-bottom: 20px;
            }

            .empty-text {
                font-size: 18px;
            }

            /* 모달 스타일 */
            .modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.5);
                z-index: 1000;
                align-items: center;
                justify-content: center;
            }

            .modal.active {
                display: flex;
            }

            .modal-content {
                background: white;
                border-radius: 24px;
                padding: 48px;
                max-width: 800px;
                width: 90%;
                max-height: 90vh;
                overflow-y: auto;
                scrollbar-width: none; /* Firefox */
                -ms-overflow-style: none; /* IE and Edge */
            }

            .modal-content::-webkit-scrollbar {
                display: none; /* Chrome, Safari, Opera */
            }

            .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 32px;
            }

            .modal-title {
                font-size: 24px;
                font-weight: 700;
                color: #1E1E1E;
            }

            .btn-close {
                padding: 8px;
                background: none;
                border: none;
                font-size: 24px;
                cursor: pointer;
                color: #999;
            }

            .form-group {
                margin-bottom: 24px;
            }

            .form-label {
                display: block;
                font-size: 14px;
                font-weight: 600;
                color: #1E1E1E;
                margin-bottom: 8px;
            }

            .form-input,
            .form-select,
            .form-textarea {
                width: 100%;
                padding: 12px 16px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 15px;
                transition: all 0.3s;
            }

            .form-input:focus,
            .form-select:focus,
            .form-textarea:focus {
                outline: none;
                border-color: #667eea;
            }

            .form-textarea {
                min-height: 200px;
                resize: vertical;
            }

            .form-actions {
                display: flex;
                gap: 12px;
                justify-content: flex-end;
            }

            .btn-cancel {
                padding: 12px 24px;
                background: #e0e0e0;
                color: #666;
                border: none;
                border-radius: 8px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
            }

            .btn-cancel:hover {
                background: #d0d0d0;
            }

            .btn-submit {
                padding: 12px 24px;
                background: #667eea;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
            }

            .btn-submit:hover {
                background: #5568d3;
            }

            /* 문의 상세 */
            .inquiry-detail-header {
                border-bottom: 2px solid #e0e0e0;
                padding-bottom: 24px;
                margin-bottom: 24px;
            }

            .inquiry-detail-title {
                font-size: 28px;
                font-weight: 700;
                color: #1E1E1E;
                margin-bottom: 16px;
            }

            .inquiry-detail-meta {
                display: flex;
                gap: 16px;
                font-size: 14px;
                color: #999;
            }

            .inquiry-detail-content {
                font-size: 16px;
                line-height: 1.8;
                color: #1E1E1E;
                margin-bottom: 32px;
                min-height: 100px;
                padding: 20px;
                background: #f9f9f9;
                border-radius: 12px;
            }

            .answer-section {
                margin-top: 32px;
                padding-top: 32px;
                border-top: 2px solid #e0e0e0;
            }

            .answer-title {
                font-size: 20px;
                font-weight: 600;
                color: #667eea;
                margin-bottom: 16px;
            }

            .answer-content {
                font-size: 16px;
                line-height: 1.8;
                color: #1E1E1E;
                padding: 20px;
                background: #e8f0ff;
                border-radius: 12px;
            }

            .no-answer {
                text-align: center;
                padding: 40px;
                color: #999;
                font-size: 14px;
            }

            .pagination {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-top: 32px;
            }

            .page-btn {
                padding: 8px 16px;
                border: 1px solid #e0e0e0;
                background: white;
                border-radius: 6px;
                cursor: pointer;
                transition: all 0.3s;
            }

            .page-btn:hover {
                background: #f5f5f5;
            }

            .page-btn.active {
                background: #667eea;
                color: white;
                border-color: #667eea;
            }

            .btn-delete-inquiry {
                padding: 8px 16px;
                background: #e53e3e;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
                margin-top: 16px;
            }

            .btn-delete-inquiry:hover {
                background: #c53030;
            }

            @media (max-width: 768px) {
                .inquiry-header {
                    flex-direction: column;
                    gap: 20px;
                    padding: 32px 24px;
                    text-align: center;
                }

                .header-left h1 {
                    font-size: 28px;
                }

                .btn-new-inquiry {
                    width: 100%;
                }

                .modal-content {
                    padding: 24px;
                    width: 95%;
                    margin: 16px;
                }

                .form-actions {
                    flex-direction: row;
                    justify-content: stretch;
                }

                .form-actions .btn-cancel,
                .form-actions .btn-submit {
                    flex: 1;
                    min-width: 0;
                    padding: 14px 16px;
                    white-space: nowrap;
                }

                .inquiry-header-row {
                    flex-direction: column;
                    gap: 8px;
                }

                .inquiry-title {
                    font-size: 16px;
                }

                .inquiry-meta {
                    flex-direction: column;
                    gap: 4px;
                }
            }
        </style>
    </th:block>
</head>
<body>
<div class="inquiry-wrapper" layout:fragment="content">
    <div class="inquiry-container">
        <!-- 헤더 -->
        <div class="inquiry-header">
            <div class="header-left">
                <h1>문의하기</h1>
                <p>궁금한 점을 문의해주세요</p>
            </div>
            <button class="btn-new-inquiry" onclick="openInquiryModal()">✏️ 새 문의 작성</button>
        </div>

        <!-- 문의 목록 -->
        <div class="inquiries-container">
            <div id="inquiriesContent">
                <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <div class="empty-text">문의 내역을 불러오는 중...</div>
                </div>
            </div>
            <div id="paginationContent"></div>
        </div>
    </div>

    <!-- 문의 작성 모달 -->
    <div class="modal" id="inquiryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">문의 작성</h2>
                <button class="btn-close" onclick="closeInquiryModal()">×</button>
            </div>
            <form id="inquiryForm">
                <div class="form-group">
                    <label class="form-label">문의 유형</label>
                    <select class="form-select" id="inquiryCategory" required>
                        <option value="RESERVATION">예약 문의</option>
                        <option value="PAYMENT">결제 문의</option>
                        <option value="STORE">가게 문의</option>
                        <option value="ACCOUNT">계정 문의</option>
                        <option value="ETC">기타 문의</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">제목</label>
                    <input type="text" class="form-input" id="inquiryTitle" placeholder="제목을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label class="form-label">내용</label>
                    <textarea class="form-textarea" id="inquiryContent" placeholder="문의 내용을 상세히 입력해주세요" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeInquiryModal()">취소</button>
                    <button type="submit" class="btn-submit">문의 등록</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 문의 상세 모달 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">문의 상세</h2>
                <button class="btn-close" onclick="closeDetailModal()">×</button>
            </div>
            <div id="inquiryDetailContent">
                <!-- 동적으로 채워짐 -->
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="custom-script">
    <script>
        let currentPage = 0;

        // 페이지 로드 시
        document.addEventListener('DOMContentLoaded', () => {
            loadInquiries();
        });

        // 문의 목록 로드
        function loadInquiries() {
            window.fetchWithAuth(`/api/inquiries/my?page=${currentPage}&size=10`)
                .then(response => {
                    if (!response.ok) {
                        if (response.status === 401) {
                            window.location.href = '/user/login';
                            return null;
                        }
                        throw new Error('문의 목록 로드 실패');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data) {
                        displayInquiries(data.content);
                        displayPagination(data);
                    }
                })
                .catch(error => {
                    console.error('문의 목록 로드 실패:', error);
                    document.getElementById('inquiriesContent').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">❌</div>
                            <div class="empty-text">문의 목록을 불러오는데 실패했습니다</div>
                        </div>
                    `;
                });
        }

        // 문의 목록 표시
        function displayInquiries(inquiries) {
            const container = document.getElementById('inquiriesContent');
            
            if (inquiries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📋</div>
                        <div class="empty-text">문의 내역이 없습니다</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = inquiries.map(inquiry => {
                const statusClass = inquiry.status === 'PENDING' ? 'status-pending' : 'status-answered';
                
                return `
                    <div class="inquiry-card" onclick="viewInquiry(${inquiry.id})">
                        <div class="inquiry-header-row">
                            <div class="inquiry-title-section">
                                <span class="inquiry-category">${inquiry.categoryDisplayName}</span>
                                <div class="inquiry-title">${inquiry.title}</div>
                            </div>
                            <span class="inquiry-status ${statusClass}">${inquiry.statusDisplayName}</span>
                        </div>
                        <div class="inquiry-meta">
                            <span>📅 ${inquiry.createdAt}</span>
                            ${inquiry.answeredAt ? `<span>✅ 답변: ${inquiry.answeredAt}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 페이지네이션 표시
        function displayPagination(data) {
            const container = document.getElementById('paginationContent');
            const totalPages = data.totalPages;
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '<div class="pagination">';
            
            if (currentPage > 0) {
                html += `<button class="page-btn" onclick="changePage(${currentPage - 1})">이전</button>`;
            }
            
            for (let i = 0; i < totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i + 1}</button>`;
            }
            
            if (currentPage < totalPages - 1) {
                html += `<button class="page-btn" onclick="changePage(${currentPage + 1})">다음</button>`;
            }
            
            html += '</div>';
            container.innerHTML = html;
        }

        // 페이지 변경
        function changePage(page) {
            currentPage = page;
            loadInquiries();
        }

        // 문의 모달 열기
        function openInquiryModal() {
            document.getElementById('inquiryModal').classList.add('active');
        }

        // 문의 모달 닫기
        function closeInquiryModal() {
            document.getElementById('inquiryModal').classList.remove('active');
            document.getElementById('inquiryForm').reset();
        }

        // 문의 작성
        document.getElementById('inquiryForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const data = {
                category: document.getElementById('inquiryCategory').value,
                title: document.getElementById('inquiryTitle').value,
                content: document.getElementById('inquiryContent').value
            };

            window.fetchWithAuth('/api/inquiries', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (response.ok) {
                    alert('문의가 등록되었습니다');
                    closeInquiryModal();
                    loadInquiries();
                } else {
                    throw new Error('문의 등록 실패');
                }
            })
            .catch(error => {
                console.error('문의 등록 실패:', error);
                alert('문의 등록에 실패했습니다');
            });
        });

        // 문의 상세 보기
        function viewInquiry(inquiryId) {
            window.fetchWithAuth(`/api/inquiries/${inquiryId}`)
                .then(response => response.json())
                .then(inquiry => {
                    displayInquiryDetail(inquiry);
                    document.getElementById('detailModal').classList.add('active');
                })
                .catch(error => {
                    console.error('문의 로드 실패:', error);
                    alert('문의를 불러오는데 실패했습니다');
                });
        }

        // 문의 상세 표시
        function displayInquiryDetail(inquiry) {
            const container = document.getElementById('inquiryDetailContent');
            const statusClass = inquiry.status === 'PENDING' ? 'status-pending' : 'status-answered';
            
            let html = `
                <div class="inquiry-detail-header">
                    <span class="inquiry-category">${inquiry.categoryDisplayName}</span>
                    <span class="inquiry-status ${statusClass}">${inquiry.statusDisplayName}</span>
                    <h2 class="inquiry-detail-title">${inquiry.title}</h2>
                    <div class="inquiry-detail-meta">
                        <span>📅 작성일: ${inquiry.createdAt}</span>
                    </div>
                </div>
                <div class="inquiry-detail-content">${inquiry.content.replace(/\n/g, '<br>')}</div>
            `;
            
            if (inquiry.status === 'ANSWERED' && inquiry.answer) {
                html += `
                    <div class="answer-section">
                        <div class="answer-title">💬 답변</div>
                        <div class="answer-content">${inquiry.answer.replace(/\n/g, '<br>')}</div>
                        <div style="margin-top: 12px; font-size: 13px; color: #999;">
                            답변일: ${inquiry.answeredAt}
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="answer-section">
                        <div class="no-answer">
                            ⏳ 답변 대기 중입니다<br>
                            빠른 시일 내에 답변드리겠습니다
                        </div>
                        <button class="btn-delete-inquiry" onclick="deleteInquiry(${inquiry.id})">문의 삭제</button>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        // 문의 삭제
        function deleteInquiry(inquiryId) {
            if (!confirm('문의를 삭제하시겠습니까?')) return;

            window.fetchWithAuth(`/api/inquiries/${inquiryId}`, {
                method: 'DELETE'
            })
            .then(response => {
                if (response.ok) {
                    alert('문의가 삭제되었습니다');
                    closeDetailModal();
                    loadInquiries();
                } else {
                    throw new Error('문의 삭제 실패');
                }
            })
            .catch(error => {
                console.error('문의 삭제 실패:', error);
                alert('답변이 완료된 문의는 삭제할 수 없습니다');
            });
        }

        // 상세 모달 닫기
        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }
    </script>
</th:block>
</body>
</html>
