<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>브라우저 안내</title>
    <style>
        .guide-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            text-align: center;
        }
        .guide-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .guide-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .guide-content {
            font-size: 16px;
            line-height: 1.8;
            color: #666;
            margin-bottom: 30px;
        }
        .guide-steps {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .guide-step {
            margin: 15px 0;
            padding-left: 30px;
            position: relative;
        }
        .guide-step::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4CAF50;
            font-weight: bold;
            font-size: 18px;
        }
        .browser-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .browser-icon {
            text-align: center;
        }
        .browser-icon img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }
        .warning-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="guide-container">
        <div class="guide-icon">🌐</div>
        <div class="guide-title">외부 브라우저에서 열어주세요</div>
        
        <div class="warning-box">
            ⚠️ 카카오톡, 네이버 등의 앱 내부 브라우저에서는<br>
            구글 로그인이 제한됩니다.
        </div>

        <div class="guide-content">
            보안 정책상 인앱 브라우저에서는 구글 로그인을 사용할 수 없습니다.<br>
            아래 방법으로 외부 브라우저에서 열어주세요.
        </div>

        <div class="guide-steps">
            <div class="guide-step">
                우측 상단 <strong>[⋯]</strong> 또는 <strong>[┇]</strong> 메뉴 클릭
            </div>
            <div class="guide-step">
                <strong>[외부 브라우저에서 열기]</strong> 또는<br>
                <strong>[Safari에서 열기]</strong> / <strong>[Chrome에서 열기]</strong> 선택
            </div>
            <div class="guide-step">
                다시 구글 로그인 시도
            </div>
        </div>

        <div class="browser-icons">
            <div class="browser-icon">
                <div style="font-size: 40px;">🌐</div>
                <div>Chrome</div>
            </div>
            <div class="browser-icon">
                <div style="font-size: 40px;">🧭</div>
                <div>Safari</div>
            </div>
            <div class="browser-icon">
                <div style="font-size: 40px;">🦊</div>
                <div>Firefox</div>
            </div>
        </div>

        <div style="margin-top: 40px;">
            <a href="/" class="btn btn-primary">메인으로 돌아가기</a>
        </div>
    </div>
</div>
</body>
</html>
