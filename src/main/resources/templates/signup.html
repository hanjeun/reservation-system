<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:with="title='회원가입', currentPage='signup'"
      layout:decorate="~{layouts/main-layout}">
<head>
    <meta charset="UTF-8">
    <th:block layout:fragment="custom-css">
        <style>
            .signup-container {
                flex-grow: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 60px 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            .signup-box {
                width: 100%;
                max-width: 500px;
                padding: 50px 40px;
                background-color: white;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            }
            .signup-box h2 {
                margin-bottom: 40px;
                font-size: clamp(24px, 5vw, 32px);
                text-align: center;
                color: #667eea;
            }
            .form-label {
                font-weight: 600;
                color: #333;
                margin-bottom: 8px;
                font-size: 14px;
            }
            .form-control {
                padding: 14px 18px;
                font-size: 15px;
                border-radius: 10px;
                border: 2px solid #e0e0e0;
                transition: all 0.3s;
                width: 100%;
            }
            .form-control:focus {
                border-color: #667eea;
                box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
                outline: none;
            }
            .btn-dark {
                padding: 14px;
                font-size: 16px;
                font-weight: 600;
                border-radius: 10px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                transition: transform 0.2s;
                width: 100%;
            }
            .btn-dark:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            }
            .link-text {
                color: #667eea;
                font-weight: 600;
                text-decoration: none;
            }
            .link-text:hover {
                text-decoration: underline;
            }
            .form-check {
                font-size: 14px;
            }
            .text-muted {
                font-size: 13px;
            }

            /* 권한 선택 버튼 스타일 */
            .role-selection {
                margin-bottom: 30px;
            }

            .role-buttons {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .role-btn {
                padding: 16px;
                border: 2px solid #e0e0e0;
                border-radius: 12px;
                background: white;
                cursor: pointer;
                transition: all 0.3s;
                text-align: center;
            }

            .role-btn:hover {
                border-color: #667eea;
                background: #f8f9ff;
            }

            .role-btn.active {
                border-color: #667eea;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }

            .role-btn input[type="radio"] {
                display: none;
            }

            .role-icon {
                font-size: 32px;
                margin-bottom: 8px;
            }

            .role-title {
                font-size: 16px;
                font-weight: 600;
                margin-bottom: 4px;
            }

            .role-description {
                font-size: 12px;
                opacity: 0.8;
            }

            @media (max-width: 576px) {
                .signup-box {
                    padding: 40px 30px;
                }
            }
        </style>
    </th:block>
</head>
<body>
<section class="signup-container" layout:fragment="content">
    <div class="signup-box">
        <h2 class="fw-bold" id="pageTitle">회원가입</h2>
        <form th:action="@{/user/signup}" th:object="${memberDto}" method="post" id="signupForm">
            <input type="hidden" id="memberId" name="memberId" value="">
            <input type="hidden" id="isEditMode" name="isEditMode" value="false">

            <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            </div>

            <div class="mb-4">
                <label for="name" class="form-label">이름</label>
                <input type="text" th:field="*{name}" th:errorclass="is-invalid" class="form-control" id="name" placeholder="이름을 입력하세요" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label">이메일</label>
                <input type="email" th:field="*{email}" th:errorclass="is-invalid" class="form-control" id="email" placeholder="example@email.com" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" th:field="*{password}" th:errorclass="is-invalid" class="form-control" id="password" placeholder="8자 이상 입력하세요">
                <small class="text-muted" id="passwordHint">비밀번호는 8자 이상으로 해주세요</small>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="mb-4">
                <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
                <input type="password" th:field="*{passwordConfirm}" th:errorclass="is-invalid" class="form-control" id="passwordConfirm" placeholder="비밀번호를 다시 입력하세요">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
            </div>

            <!-- 권한 선택 -->
            <div class="role-selection">
                <label class="form-label">가입 유형을 선택해주세요</label>
                <div class="role-buttons">
                    <label class="role-btn active" onclick="selectRole(this, 'USER')">
                        <input type="radio" name="role" value="USER" th:field="*{role}" checked>
                        <div class="role-icon">👤</div>
                        <div class="role-title">일반 사용자</div>
                        <div class="role-description">예약만 이용</div>
                    </label>

                    <label class="role-btn" onclick="selectRole(this, 'BUSINESS')">
                        <input type="radio" name="role" value="BUSINESS" th:field="*{role}">
                        <div class="role-icon">🏪</div>
                        <div class="role-title">사업자</div>
                        <div class="role-description">가게 등록 및 관리</div>
                    </label>
                </div>
            </div>

            <div class="mb-3 form-check" id="termsCheckbox">
                <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                <label class="form-check-label" for="agreeTerms">
                    <small>이용약관 및 개인정보처리방침에 동의합니다</small>
                </label>
            </div>

            <div class="d-grid mb-4">
                <button type="submit" class="btn btn-dark" id="submitBtn">가입하기</button>
            </div>

            <div class="text-center">
                <small id="loginLink">이미 계정이 있으신가요? <a th:href="@{/user/login}" class="link-text">로그인</a></small>
            </div>
        </form>
    </div>
</section>

<th:block layout:fragment="custom-script">
    <script>
        // 페이지 로드 시 수정 모드 확인
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const isEdit = urlParams.get('edit') === 'true';
            const memberId = urlParams.get('memberId');

            if (isEdit && memberId) {
                enableEditMode(memberId);
            }
        });

        // 수정 모드 활성화
        function enableEditMode(memberId) {
            // 페이지 제목 변경
            document.getElementById('pageTitle').textContent = '계정 수정';
            document.getElementById('submitBtn').textContent = '수정하기';
            document.getElementById('loginLink').style.display = 'none';
            document.getElementById('termsCheckbox').style.display = 'none';

            // 비밀번호 필수 해제
            document.getElementById('password').removeAttribute('required');
            document.getElementById('passwordConfirm').removeAttribute('required');
            document.getElementById('passwordHint').textContent = '비밀번호를 변경하지 않으려면 비워두세요';

            // hidden 필드 설정
            document.getElementById('memberId').value = memberId;
            document.getElementById('isEditMode').value = 'true';

            // 폼 액션 변경
            document.getElementById('signupForm').action = '/api/member/update';
            document.getElementById('signupForm').setAttribute('onsubmit', 'return handleUpdate(event)');

            // 회원 정보 불러오기
            window.fetchWithAuth('/api/member/me')
            .then(response => {
                if (!response.ok) throw new Error('사용자 정보를 불러올 수 없습니다');
                return response.json();
            })
            .then(data => {
                document.getElementById('name').value = data.name || '';
                document.getElementById('email').value = data.email || '';

                // 역할 설정
                const roleButtons = document.querySelectorAll('.role-btn');
                roleButtons.forEach(btn => {
                    const input = btn.querySelector('input[type="radio"]');
                    if (input.value === data.role) {
                        btn.classList.add('active');
                        input.checked = true;
                    } else {
                        btn.classList.remove('active');
                    }
                });

                console.log('✅ 회원 정보 로드 완료:', data);
            })
            .catch(error => {
                console.error('❌ 회원 정보 로드 실패:', error);
                alert('사용자 정보를 불러오는데 실패했습니다.');
                window.location.href = '/user/mypage';
            });
        }

        // 수정 처리
        function handleUpdate(event) {
            event.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value || null,
                passwordConfirm: document.getElementById('passwordConfirm').value || null,
                role: document.querySelector('input[name="role"]:checked').value
            };

            // 비밀번호 검증 (입력된 경우에만)
            if (formData.password) {
                if (formData.password.length < 8) {
                    alert('비밀번호는 8자 이상이어야 합니다.');
                    return false;
                }
                if (formData.password !== formData.passwordConfirm) {
                    alert('비밀번호가 일치하지 않습니다.');
                    return false;
                }
            }

            window.fetchWithAuth('/api/member/update', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                if (!response.ok) throw new Error('회원 정보 수정에 실패했습니다');
                return response.json();
            })
            .then(data => {
                alert('회원 정보가 수정되었습니다!');
                window.location.href = '/user/mypage';
            })
            .catch(error => {
                console.error('❌ 회원 정보 수정 실패:', error);
                alert('회원 정보 수정에 실패했습니다: ' + error.message);
            });

            return false;
        }

        function selectRole(element, roleValue) {
            // 모든 버튼에서 active 클래스 제거
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // 선택된 버튼에 active 클래스 추가
            element.classList.add('active');

            // 해당 라디오 버튼 체크
            element.querySelector('input[type="radio"]').checked = true;
        }
    </script>
</th:block>
</body>
</html>
