<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<footer class="footer-custom" th:fragment="footer">
    <div class="footer-content">
        <div class="footer-section">
            <h3>통합예약시스템</h3>
            <p>언제 어디서나 간편하게</p>
            <p>예약하고 관리하세요</p>
            <p style="margin-top: 20px;">
                <strong>고객센터</strong><br>
                평일 09:00 - 18:00<br>
                주말 및 공휴일 휴무
            </p>
        </div>

        <div class="footer-section" id="footerServiceSection" style="display: none;">
            <h3>서비스</h3>
            <a th:href="@{/store/register}" id="footerStoreRegister" style="display: none;">가게 등록</a>
            <a th:href="@{/store/promotion}" id="footerStorePromotion">홍보하기</a>
            <a th:href="@{/community}" id="footerCommunity">커뮤니티</a>
        </div>

        <div class="footer-section" id="footerAdminSection" style="display: none;">
            <h3>관리</h3>
            <a th:href="@{/customer-service/admin/inquiry}" id="footerAdmin">문의관리</a>
        </div>

        <div class="footer-section">
            <h3>고객지원</h3>
            <!-- 로그인 필요 링크 -->
            <a th:href="@{/customer-service/notice}" id="footerNotice" style="display: none;">공지사항</a>
            <a th:href="@{/customer-service/inquiry}" id="footerInquiry" style="display: none;">문의하기</a>
            <!-- 공개 링크 (항상 표시) -->
            <a th:href="@{/customer-service/policy}">정책</a>
        </div>

        <div class="footer-section">
            <h3>회사정보</h3>
            <p>대표: 한재은</p>
            <p>사업자등록번호: 123-45-67890</p>
            <p>주소: 서울시 강남구</p>
            <p>이메일: info@reservation.com</p>
        </div>
    </div>

    <div class="footer-bottom">
        <p>&copy; 2025 통합예약시스템. All rights reserved.</p>
        <div class="footer-social">
            <a href="#" title="Facebook">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </a>
            <a href="#" title="Instagram">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>

            <a href="#" title="Twitter">

                </svg>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const serviceSection = document.getElementById('footerServiceSection');
            const adminSection = document.getElementById('footerAdminSection');
            const storeRegister = document.getElementById('footerStoreRegister');
            const storePromotion = document.getElementById('footerStorePromotion');
            const footerNotice = document.getElementById('footerNotice');
            const footerInquiry = document.getElementById('footerInquiry');

            if (!serviceSection) return;

            // UserState를 통해 캐시된 사용자 정보 사용
            window.UserState.getUser()
                .then(user => {
                    // 로그인 사용자: 서비스 섹션 + 고객지원 전체 표시
                    serviceSection.style.display = 'block';
                    footerNotice.style.display = 'block';
                    footerInquiry.style.display = 'block';

                    // 역할에 따라 홍보하기/추천 가게 텍스트 변경
                    if (window.hasBusinessOrAdminRole(user.role)) {
                        storePromotion.textContent = '홍보하기';
                        storeRegister.style.display = 'block';
                    } else {
                        storePromotion.textContent = '추천가게';
                    }

                    // 관리자만 관리 섹션 표시
                    if (user.role === window.RoleEnum.ADMIN) {
                        adminSection.style.display = 'block';
                    }
                })
                .catch(() => {
                    // 비로그인 상태: 서비스 섹션 숨김, 고객지원은 정책만 표시
                    serviceSection.style.display = 'none';
                    adminSection.style.display = 'none';
                    footerNotice.style.display = 'none';
                    footerInquiry.style.display = 'none';
                });
        });
    </script>
</footer>
</body>
</html>
