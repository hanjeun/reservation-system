<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
</head>
<body>
<header class="header-custom" th:fragment="header(currentPage)">
    <a class="header-logo" th:href="@{/main}">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
            <path d="M15 38V22H25V38M5 17L20 5L35 17V35C35 35.88 34.65 36.72 34.02 37.35C33.39 37.98 32.55 38 31.67 38H8.33C7.45 38 6.61 37.98 5.98 37.35C5.35 36.72 5 35.88 5 35V17Z"
                  stroke="#1E1E1E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>

    <!-- 햄버거 메뉴 버튼 (모바일용) -->
    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- 모바일 메뉴 오버레이 -->
    <div class="mobile-menu-overlay" id="mobileOverlay" onclick="toggleMobileMenu()"></div>

    <nav class="header-nav" id="headerNav">
        <!-- 모바일 메뉴 닫기 버튼 -->
        <button class="mobile-close-btn" onclick="toggleMobileMenu()">✕</button>

        <!-- 로그인 필요 메뉴 (비로그인 시 숨김) -->
        <a class="nav-pill auth-required" th:classappend="${currentPage=='store-register'} ? 'active'" th:href="@{/store/register}" id="menuStoreRegister" style="display:none;">가게등록</a>
        <a class="nav-pill auth-required" th:classappend="${currentPage=='store-promotion'} ? 'active'" th:href="@{/store/promotion}" id="menuStorePromotion" style="display:none;">홍보하기</a>
        <a class="nav-pill auth-required" th:classappend="${currentPage=='community'} ? 'active'" th:href="@{/community}" id="menuCommunity" style="display:none;">커뮤니티</a>
        <a class="nav-pill auth-required" th:classappend="${currentPage=='notice'} ? 'active'" th:href="@{/customer-service/notice}" id="menuNotice" style="display:none;">공지사항</a>
        <a class="nav-pill auth-required" th:classappend="${currentPage=='inquiry'} ? 'active'" th:href="@{/customer-service/inquiry}" id="menuInquiry" style="display:none;">문의하기</a>
        <!-- 공개 메뉴 (항상 표시) -->
        <a class="nav-pill" th:classappend="${currentPage=='policy'} ? 'active'" th:href="@{/customer-service/policy}">정책</a>
        <!-- 관리자 메뉴 -->
        <a class="nav-pill" th:classappend="${currentPage=='admin-inquiry'} ? 'active'" th:href="@{/customer-service/admin/inquiry}" id="menuAdminInquiry" style="display:none;">문의관리</a>
        <a class="nav-pill" th:classappend="${currentPage=='admin-business'} ? 'active'" th:href="@{/admin/business-verification}" id="menuAdminBusiness" style="display:none;">사업자인증</a>
    </nav>

    <div class="header-auth" id="authButtons" style="visibility: hidden;">
        <div id="loggedOut" style="display: none; align-items: center; gap: 12px;">
            <a class="btn-login" th:href="@{/user/login}">로그인</a>
            <a class="btn-signup" th:href="@{/user/signup}">가입하기</a>
        </div>
        <div id="loggedIn" style="display: none; align-items: center; gap: 12px;">
            <a class="btn-login" th:href="@{/user/mypage}">마이페이지</a>
            <button type="button" class="btn-signup" onclick="handleLogout()">로그아웃</button>
        </div>
    </div>

    <script>
        // 모바일 메뉴 토글
        function toggleMobileMenu() {
            const nav = document.getElementById('headerNav');
            const overlay = document.getElementById('mobileOverlay');
            const hamburger = document.getElementById('hamburgerBtn');

            nav.classList.toggle('active');
            overlay.classList.toggle('active');
            hamburger.classList.toggle('active');

            // 스크롤 방지
            document.body.style.overflow = nav.classList.contains('active') ? 'hidden' : '';
        }

        // 페이지 로드 시 인증 상태 확인 - UserState 사용
        (async function checkAuth() {
            const currentPath = window.location.pathname;
            const publicPages = ['/user/login', '/user/signup'];

            // 비로그인 상태 UI 설정 함수
            function showLoggedOutUI() {
                document.getElementById('loggedOut').style.display = 'flex';
                document.getElementById('loggedIn').style.display = 'none';
                document.getElementById('authButtons').style.visibility = 'visible';
                // 로그인 필요 메뉴 숨김
                document.querySelectorAll('.auth-required').forEach(el => el.style.display = 'none');
            }

            // 로그인 상태 UI 설정 함수
            function showLoggedInUI(user) {
                document.getElementById('loggedOut').style.display = 'none';
                document.getElementById('loggedIn').style.display = 'flex';
                document.getElementById('authButtons').style.visibility = 'visible';

                // 로그인 필요 메뉴 표시
                document.getElementById('menuStorePromotion').style.display = 'block';
                document.getElementById('menuCommunity').style.display = 'block';
                document.getElementById('menuNotice').style.display = 'block';
                document.getElementById('menuInquiry').style.display = 'block';

                // 권한에 따른 메뉴 표시 및 텍스트 변경
                const menuStorePromotion = document.getElementById('menuStorePromotion');
                if (window.hasBusinessOrAdminRole(user.role)) {
                    menuStorePromotion.textContent = '홍보하기';
                    document.getElementById('menuStoreRegister').style.display = 'block';
                } else {
                    menuStorePromotion.textContent = '추천가게';
                }

                // 관리자 메뉴는 관리자만 표시
                if (user.role === window.RoleEnum.ADMIN) {
                    document.getElementById('menuAdminInquiry').style.display = 'block';
                    document.getElementById('menuAdminBusiness').style.display = 'block';
                }
            }

            // 공개 페이지에서는 인증 체크 스킵
            if (publicPages.includes(currentPath)) {
                showLoggedOutUI();
                return;
            }

            try {
                const user = await window.UserState.getUser();

                if (!user) {
                    showLoggedOutUI();
                    return;
                }

                showLoggedInUI(user);
            } catch (error) {
                showLoggedOutUI();
            }
        })();

        function handleLogout() {
            window.UserState.clearUser();

            fetch('/api/auth/logout', {
                method: 'POST',
                credentials: 'include'
            })
            .then(() => window.location.href = '/main')
            .catch(() => window.location.href = '/main');
        }
    </script>
</header>
</body>
</html>
