<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">통합예약시스템</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">

    <!-- CSS 링크 -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/header.css}"/>
    <link rel="stylesheet" th:href="@{/css/footer.css}"/>

    <!-- Token Refresh 유틸리티 - 모든 페이지에서 사용 가능 -->
    <script th:src="@{/js/auth/token-refresh.js}"></script>
    <!-- User State 관리 - 사용자 정보 전역 캐싱 -->
    <script th:src="@{/js/auth/user-state.js}"></script>

    <style>
        /* ========================================
           전역 스타일 리셋 및 기본 설정
           ======================================== */

        /* 모든 요소의 기본 여백 제거 및 일관된 박스 모델 적용 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* HTML 루트 설정 */
        html {
            height: 100%;
            scroll-behavior: smooth; /* 부드러운 스크롤 */
            -webkit-font-smoothing: antialiased; /* 폰트 렌더링 개선 */
            -moz-osx-font-smoothing: grayscale;
        }

        /* 스크롤바 숨기기 (Chrome, Safari, Edge) */
        ::-webkit-scrollbar {
            width: 0px;
            height: 0px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: transparent;
        }

        /* Firefox용 스크롤바 숨기기 */
        * {
            scrollbar-width: none;
            scrollbar-color: transparent transparent;
        }

        /* IE와 Edge용 스크롤바 숨기기 */
        body {
            -ms-overflow-style: none;
        }

        /* Body를 flex 컨테이너로 설정하여 sticky footer 구현 */
        body {
            min-height: 100vh; /* 뷰포트 전체 높이를 최소값으로 */
            display: flex;
            flex-direction: column; /* 세로 방향으로 요소 배치 */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #FFFFFF;
            color: #1E1E1E;
            line-height: 1.6;
            overflow-x: hidden; /* 가로 스크롤 방지 */
        }

        /* Main 컨텐츠 영역 - 남은 공간을 모두 차지하도록 */
        main {
            flex: 1 0 auto; /* flex-grow: 1, flex-shrink: 0, flex-basis: auto */
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ========================================
           접근성 및 사용성 개선
           ======================================== */

        /* 이미지가 컨테이너를 넘어가지 않도록 */
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* 포커스 시 접근성 개선 (키보드 네비게이션) */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* 기본 링크 스타일 */
        a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        /* 버튼 기본 스타일 초기화 */
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* ========================================
           반응형 폰트 크기
           ======================================== */

        /* 기본 폰트 크기를 반응형으로 설정 */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            body {
                font-size: 15px;
            }
        }

        @media (min-width: 1025px) {
            body {
                font-size: 16px;
            }
        }

        /* ========================================
           성능 최적화
           ======================================== */

        /* 하드웨어 가속을 사용하는 요소들 */
        .header-custom,
        .footer-custom {
            will-change: transform;
            transform: translateZ(0);
        }

        /* 스크롤바 커스터마이징 (Webkit 브라우저) */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }
    </style>

    <!-- 페이지별 커스텀 CSS -->
    <th:block layout:fragment="custom-css"></th:block>
</head>
<body>
    <!-- 헤더 프래그먼트 -->
    <div th:replace="fragments/header :: header(${currentPage})"></div>

    <!-- 내용 영역 -->
    <main layout:fragment="content"></main>

    <!-- 푸터 프래그먼트 -->
    <div th:replace="fragments/footer :: footer"></div>

    <!-- 스크립트 -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

    <!-- 페이지별 커스텀 스크립트 -->
    <th:block layout:fragment="custom-script"></th:block>
</body>
</html>
