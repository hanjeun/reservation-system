spring:
  application:
    name: reservation-system-test
  
  # 테스트용 H2 인메모리 데이터베이스
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  
  h2:
    console:
      enabled: true
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# JWT 테스트 설정
jwt:
  issuer: reservation-system-test
  secret-key: 501b8d989581209051c685bee6353fc428c529dcb87c25c946a6e9d86fa800a9
  access-token:
    expiration-minutes: 30
  refresh-token:
    expiration-days: 14

# 로그 레벨
logging:
  level:
    ac.inhatc.reservation_system: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
