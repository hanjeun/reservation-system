name: CICD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker
        run: docker build --platform linux/amd64 -t ${{ secrets.DOCKERHUB_USERNAME }}/reservation-system .

      - name: Push Docker
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/reservation-system:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set target IP
        run: |
          # Blue(8080) 먼저 시도
          STATUS_BLUE=$(curl -o /dev/null -w "%{http_code}" -s --connect-timeout 5 "http://${{ secrets.RESERVATION_SYSTEM_SERVER_IP }}:8080/env" || echo "000")
          echo "Blue status: $STATUS_BLUE"
          
          # Green(8081) 시도
          STATUS_GREEN=$(curl -o /dev/null -w "%{http_code}" -s --connect-timeout 5 "http://${{ secrets.RESERVATION_SYSTEM_SERVER_IP }}:8081/env" || echo "000")
          echo "Green status: $STATUS_GREEN"
          
          # 현재 활성 서버 판단
          if [ "$STATUS_BLUE" = "200" ]; then
            CURRENT_UPSTREAM="blue"
          elif [ "$STATUS_GREEN" = "200" ]; then
            CURRENT_UPSTREAM="green"
          else
            # 둘 다 없으면 blue 배포 (초기 상태)
            CURRENT_UPSTREAM="none"
          fi
          
          echo "Current upstream: $CURRENT_UPSTREAM"
          echo CURRENT_UPSTREAM=$CURRENT_UPSTREAM >> $GITHUB_ENV
          
          # 타겟 서버 설정
          if [ "$CURRENT_UPSTREAM" = "blue" ]; then
            echo "CURRENT_PORT=8080" >> $GITHUB_ENV
            echo "STOPPED_PORT=8081" >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=green" >> $GITHUB_ENV
          else
            # green이거나 none인 경우 blue로 배포
            echo "CURRENT_PORT=8081" >> $GITHUB_ENV
            echo "STOPPED_PORT=8080" >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=blue" >> $GITHUB_ENV
          fi

      - name: Docker compose
        uses: appleboy/ssh-action@master
        with:
          username: ubuntu
          host: ${{ secrets.RESERVATION_SYSTEM_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/reservation-system:latest
            sudo docker compose -f docker-compose-${{env.TARGET_UPSTREAM}}.yml up -d

      - name: Check deploy server URL
        uses: jtalk/url-health-check-action@v3
        with:
          url: http://${{ secrets.RESERVATION_SYSTEM_SERVER_IP }}:${{env.STOPPED_PORT}}/env
          max-attempts: 5
          retry-delay: 15s

      - name: Change nginx upstream
        uses: appleboy/ssh-action@master
        with:
          username: ubuntu
          host: ${{ secrets.RESERVATION_SYSTEM_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker exec -i nginxserver bash -c 'echo "set \$service_url ${{ env.TARGET_UPSTREAM }};" > /etc/nginx/conf.d/service-env.inc && nginx -s reload'

      - name: Stop current server
        uses: appleboy/ssh-action@master
        with:
          username: ubuntu
          host: ${{ secrets.RESERVATION_SYSTEM_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker stop ${{env.CURRENT_UPSTREAM}} || true
            sudo docker rm ${{env.CURRENT_UPSTREAM}} || true
